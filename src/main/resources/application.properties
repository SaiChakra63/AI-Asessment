server.port=${SERVER_PORT:8080}
server.servlet.context-path=/
spring.application.name=url-shortener-service

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/urlshortener}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.batch_size=20
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

management.endpoint.health.show-details=when_authorized
management.endpoints.web.exposure.include=health,info,metrics,prometheus
# Redis is an optimization in Phase 2, not a hard dependency. The custom
# /api/v1/health endpoint reports degradation while database traffic continues.
management.health.redis.enabled=false

springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html

app.short-code.length=6
app.short-base-url=${SHORT_BASE_URL:http://localhost:8080/api/v1/urls}

# Phase 2 Redis cache
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.connect-timeout=${REDIS_CONNECT_TIMEOUT:2s}
spring.data.redis.timeout=${REDIS_TIMEOUT:2s}
spring.data.redis.repositories.enabled=false
app.cache.url-ttl=${URL_CACHE_TTL:24h}
app.cache.stats-ttl=${STATS_CACHE_TTL:1h}
app.cache.required=${CACHE_REQUIRED:false}

# Phase 2 distributed rate limiting
app.rate-limit.enabled=${RATE_LIMIT_ENABLED:true}
app.rate-limit.capacity=${RATE_LIMIT_CAPACITY:100}
app.rate-limit.window=${RATE_LIMIT_WINDOW:1m}

# Forwarded IP and geo headers are accepted only behind a trusted proxy.
app.proxy.trust-forwarded-headers=${TRUST_FORWARDED_HEADERS:false}
app.analytics.trust-geo-headers=${TRUST_GEO_HEADERS:false}
app.analytics.visitor-hash-salt=${VISITOR_HASH_SALT:phase2-local-development-only}

logging.level.com.shortener=INFO
