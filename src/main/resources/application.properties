server.port=${SERVER_PORT:8080}
server.servlet.context-path=/
spring.application.name=url-shortener-service
# This service uses its own API-key filter and does not need Boot's generated
# in-memory username/password account.
spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.security.servlet.UserDetailsServiceAutoConfiguration

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/urlshortener}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.batch_size=20
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

management.endpoint.health.show-details=when_authorized
management.endpoints.web.exposure.include=health,prometheus
# After application startup, Redis failures fall back to PostgreSQL and the
# custom health endpoint reports degradation. Local Compose still waits for
# initial Redis health before starting the application container.
management.health.redis.enabled=false

springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html

app.short-code.length=6
app.short-base-url=${SHORT_BASE_URL:http://localhost:8080/api/v1/urls}

# Phase 2 Redis cache
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.connect-timeout=${REDIS_CONNECT_TIMEOUT:2s}
spring.data.redis.timeout=${REDIS_TIMEOUT:2s}
spring.data.redis.repositories.enabled=false
app.cache.url-ttl=${URL_CACHE_TTL:24h}
app.cache.stats-ttl=${STATS_CACHE_TTL:1h}
app.cache.required=${CACHE_REQUIRED:false}

# Phase 2 distributed rate limiting
app.rate-limit.enabled=${RATE_LIMIT_ENABLED:true}
app.rate-limit.capacity=${RATE_LIMIT_CAPACITY:100}
app.rate-limit.window=${RATE_LIMIT_WINDOW:1m}

# Forwarded IP and geo headers are accepted only when the immediate network
# peer is in the explicit trusted-proxy allowlist.
app.proxy.trust-forwarded-headers=${TRUST_FORWARDED_HEADERS:false}
app.proxy.trusted-addresses=${TRUSTED_PROXY_ADDRESSES:}
app.analytics.trust-geo-headers=${TRUST_GEO_HEADERS:false}
app.analytics.visitor-hash-salt=${VISITOR_HASH_SALT}

# Phase 3 API-key authentication. A blank bootstrap key only disables bootstrap
# provisioning. Stored clients can authenticate when their original valid
# API_KEY_PEPPER is still configured.
app.security.api-key.header=X-API-Key
app.security.api-key.pepper=${API_KEY_PEPPER:}
app.security.bootstrap.client-id=${APP_API_CLIENT_ID:local-assessment-client}
app.security.bootstrap.display-name=${APP_API_CLIENT_DISPLAY_NAME:Local assessment client}
app.security.bootstrap.api-key=${APP_BOOTSTRAP_API_KEY:}
app.security.bootstrap.authorities=${APP_API_CLIENT_AUTHORITIES:URL_WRITE,ANALYTICS_READ,OPS_READ}
app.security.bootstrap.update-existing=${APP_API_CLIENT_UPDATE_EXISTING:false}

logging.level.com.shortener=INFO
