# Shared configuration. Select an environment explicitly with
# SPRING_PROFILES_ACTIVE=dev, test, or prod.
spring.application.name=url-shortener-service
# This service uses its own API-key filter and does not need Boot's generated
# in-memory username/password account.
spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.security.servlet.UserDetailsServiceAutoConfiguration

spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.batch_size=20
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

management.endpoints.web.exposure.include=health,prometheus
# After application startup, Redis failures fall back to PostgreSQL and the
# custom health endpoint reports degradation. Local Compose still waits for
# initial Redis health before starting the application container.
management.health.redis.enabled=false

springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html

app.short-code.length=6
spring.data.redis.repositories.enabled=false

app.security.api-key.header=X-API-Key
