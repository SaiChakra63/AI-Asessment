server.port=${SERVER_PORT:8080}
server.servlet.context-path=/

# Production infrastructure and secrets must be supplied by the deployment
# platform. There are deliberately no local database or secret defaults.
spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}

management.endpoint.health.show-details=never
springdoc.api-docs.enabled=${SPRINGDOC_API_DOCS_ENABLED:false}
springdoc.swagger-ui.enabled=${SPRINGDOC_SWAGGER_UI_ENABLED:false}

app.short-base-url=${SHORT_BASE_URL}

spring.data.redis.host=${REDIS_HOST}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.connect-timeout=${REDIS_CONNECT_TIMEOUT:2s}
spring.data.redis.timeout=${REDIS_TIMEOUT:2s}
app.cache.url-ttl=${URL_CACHE_TTL:24h}
app.cache.stats-ttl=${STATS_CACHE_TTL:1h}
app.cache.required=${CACHE_REQUIRED:false}

app.rate-limit.enabled=${RATE_LIMIT_ENABLED:true}
app.rate-limit.capacity=${RATE_LIMIT_CAPACITY:100}
app.rate-limit.window=${RATE_LIMIT_WINDOW:1m}

app.proxy.trust-forwarded-headers=${TRUST_FORWARDED_HEADERS:false}
app.proxy.trusted-addresses=${TRUSTED_PROXY_ADDRESSES:}
app.analytics.trust-geo-headers=${TRUST_GEO_HEADERS:false}
app.analytics.visitor-hash-salt=${VISITOR_HASH_SALT}

app.security.api-key.pepper=${API_KEY_PEPPER}
app.security.bootstrap.client-id=${APP_API_CLIENT_ID:bootstrap-client}
app.security.bootstrap.display-name=${APP_API_CLIENT_DISPLAY_NAME:Bootstrap client}
app.security.bootstrap.api-key=${APP_BOOTSTRAP_API_KEY:}
app.security.bootstrap.authorities=${APP_API_CLIENT_AUTHORITIES:URL_WRITE,ANALYTICS_READ,OPS_READ}
app.security.bootstrap.update-existing=${APP_API_CLIENT_UPDATE_EXISTING:false}

logging.level.com.shortener=${APP_LOG_LEVEL:INFO}
