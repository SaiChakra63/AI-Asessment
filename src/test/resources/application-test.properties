server.port=0
server.servlet.context-path=/

# Testcontainers overrides the connection values in integration tests.
spring.datasource.url=jdbc:postgresql://localhost:5432/urlshortener_test
spring.datasource.username=test
spring.datasource.password=test

management.endpoint.health.show-details=never

app.short-base-url=http://localhost/api/v1/urls

spring.data.redis.host=localhost
spring.data.redis.port=6379
spring.data.redis.connect-timeout=2s
spring.data.redis.timeout=2s
app.cache.url-ttl=5m
app.cache.stats-ttl=1m
app.cache.required=false

app.rate-limit.enabled=true
app.rate-limit.capacity=100
app.rate-limit.window=1m

app.proxy.trust-forwarded-headers=false
app.proxy.trusted-addresses=
app.analytics.trust-geo-headers=false
app.analytics.visitor-hash-salt=test-visitor-hash-salt-0123456789

app.security.api-key.pepper=test-api-key-pepper-012345678901
app.security.bootstrap.client-id=test-client
app.security.bootstrap.display-name=Test client
app.security.bootstrap.api-key=
app.security.bootstrap.authorities=URL_WRITE,ANALYTICS_READ,OPS_READ
app.security.bootstrap.update-existing=false

logging.level.com.shortener=WARN
