global:
  scrape_interval: 5s
  evaluation_interval: 5s

scrape_configs:
  - job_name: url-shortener
    metrics_path: /actuator/prometheus
    static_configs:
      - targets:
          - url-shortener:8080
        labels:
          application: url-shortener
          environment: local

  - job_name: prometheus
    static_configs:
      - targets:
          - prometheus:9090
